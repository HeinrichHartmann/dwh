[project]
name = "dwh"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Heinrich Hartmann", email = "heinrich@heinrichhartmann.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
]

[project.scripts]
dwh = "dwh:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.12"]
build-backend = "uv_build"

[tool.ruff]
# Ignore F541: f-string without any placeholders
# Justification: Using f-strings consistently improves readability and makes future
# interpolation easier, even when there are currently no placeholders.
lint.ignore = ["F541"]
